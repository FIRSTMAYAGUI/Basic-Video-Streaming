<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
</head>
<body>
    <video  id="video" controls autoplay>
    </video>

    <script>
        const video = document.getElementById('video');
        
        if (Hls.isSupported()) {
            const hls = new Hls();

            hls.on(Hls.Events.MEDIA_ATTACHED, function () {
            console.log('video and hls.js are now bound together !');
            });
            
            hls.on(Hls.Events.LEVEL_SWITCHED, function (event, data) {
                const currentLevel = hls.levels[data.level];
                console.log(`[ABR] Switched to Level ${data.level}:`);
                console.log(`  -> Resolution: ${currentLevel.width}x${currentLevel.height}`);
                console.log(`  -> Bandwidth: ${currentLevel.bitrate} bps`);
            });

            hls.on(Hls.Events.MANIFEST_PARSED, function (event, data) {
                console.log(
                    'manifest loaded, found ' + data.levels.length + ' quality level',
                );
            });
            
            hls.loadSource('http://localhost:3000/masterPlaylist.m3u8');
            // bind them together
            hls.attachMedia(video);
        }
        else {
            // Fallback for Safari (native HLS support)
            video.src = 'http://localhost:3000/test-video2/masterPlaylist.m3u8';
        }
    </script>
</body>
</html>
